services:
  db:
    image: mysql:8.0
    container_name: faculty-services-db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: faculty_services
      MYSQL_USER: faculty
      MYSQL_PASSWORD: faculty_pass
      TZ: Europe/Kyiv
    ports:
      - "127.0.0.1:3407:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - faculty_services_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  faculty_services_data:
